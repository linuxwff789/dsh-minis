name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="dsh-minis-nightly"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          NOTES="DSH Minis (proot Debian terminal, online rootfs) nightly — ${{ github.sha }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$NOTES" --notes "Download: https://github.com/linuxwff789/dsh-minis/releases/latest"
          else
            gh release create "$TAG" "$APK" --title "$NOTES" --notes "Download: https://github.com/linuxwff789/dsh-minis/releases/latest"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-minis-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
